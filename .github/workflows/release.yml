name: VELTRIX Signed Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GRADLE_VERSION: '9.3.1'
  ANDROID_PLATFORM: 'android-37'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.VELTRIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VELTRIX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VELTRIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VELTRIX_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing keystore secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing keystore password" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing key alias" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing key password" && exit 1)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform packages
        run: |
          sdkmanager --install \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VELTRIX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/veltrix-release.jks"

      - name: Build signed release APK
        env:
          VELTRIX_KEYSTORE_FILE: ${{ runner.temp }}/veltrix-release.jks
          VELTRIX_KEYSTORE_PASSWORD: ${{ secrets.VELTRIX_KEYSTORE_PASSWORD }}
          VELTRIX_KEY_ALIAS: ${{ secrets.VELTRIX_KEY_ALIAS }}
          VELTRIX_KEY_PASSWORD: ${{ secrets.VELTRIX_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi

          gradle --no-daemon --stacktrace assembleRelease \
            -PAPP_VERSION="$VERSION" \
            -PAPP_VERSION_CODE="$GITHUB_RUN_NUMBER"

          cp app/build/outputs/apk/release/app-release.apk \
            "VELTRIX-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: VELTRIX-*.apk
